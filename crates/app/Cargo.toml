[package]
name = "zobrist-app"
description = "The zobrist desktop app. A Tauri shell with a React view. Owns no chess logic."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Starts a WebDriver server inside the app. Only the end-to-end test builds with it.
webdriver = ["dep:tauri-plugin-wdio-webdriver", "zobrist-online/fixture"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
shakmaty = "0.30.2"
tauri = "2.12.7"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-wdio-webdriver = { version = "1.5.1", optional = true }
ts-rs = "12.0.1"
zobrist-core = { path = "../core", version = "0.1.0" }
zobrist-online = { path = "../online", version = "0.1.0" }
zobrist-store = { path = "../store", version = "0.1.0" }

[build-dependencies]
tauri-build = "2.7.6"
