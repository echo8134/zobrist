[package]
name = "zobrist-cli"
description = "The zobrist command line. Owns no chess logic."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "zobrist"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
zobrist-core = { path = "../core", version = "0.2.0" }
zobrist-online = { path = "../online", version = "0.2.0" }
zobrist-store = { path = "../store", version = "0.2.0" }

[dev-dependencies]
zobrist-online = { path = "../online", version = "0.2.0", features = ["fixture"] }
