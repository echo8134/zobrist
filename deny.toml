[graph]
all-features = true

[advisories]
yanked = "deny"
ignore = [
    # The GTK 3 bindings under Tauri 2 (glib-macros and gtk3-macros 0.18) use this crate, and no
    # Tauri 2 release is free of them. It runs at compile time only and is not part of the app.
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error is unmaintained, and Tauri 2 on Linux cannot build without it" },
]

[licenses]
unused-allowed-license = "allow"
allow = [
    "GPL-3.0-or-later",
    "GPL-3.0",
    "GPL-2.0-or-later",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "Unlicense",
    "0BSD",
    "BSL-1.0",
    # Tauri's tree needs it for cssparser, selectors, dtoa-short, and option-ext. Section 3.3 of
    # the license lets a larger work that contains such files be distributed under the GPL.
    "MPL-2.0",
]
confidence-threshold = 0.8

[bans]
# Tauri's tree holds dozens of crates in two versions. A warning for each buried the gate's
# output and never failed it.
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
