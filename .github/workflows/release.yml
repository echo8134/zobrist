name: release

on:
  push:
    branches: [main]
  # Proves the build of the release files before a tag exists. Only the release PR changes
  # CHANGELOG.md.
  pull_request:
    paths:
      - .github/workflows/release.yml
      - release-plz.toml
      - crates/app/tauri.conf.json
      - CHANGELOG.md

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  release-pr:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A token of the release app writes the branch and the PR, so that the checks run on the
    # release PR. GitHub starts no workflow for a PR that the default token opened.
    permissions:
      contents: read
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      # The token is valid for one hour, for this repository alone, and with only the two
      # permissions that release-plz needs.
      - id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: release-plz/action@66b324fd6c72d05d2a08568492ecdd62bfb8a62b # v0.5.148
        with:
          command: release-pr
          version: 0.4.3
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

  # Creates the tag and the draft release when the pushed commit is the merge of a release PR.
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: read
    outputs:
      releases_created: ${{ steps.release-plz.outputs.releases_created }}
      # Every crate shares the tag name, so the first entry carries the tag of the release.
      tag: ${{ fromJSON(steps.release-plz.outputs.releases)[0].tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      - id: release-plz
        uses: release-plz/action@66b324fd6c72d05d2a08568492ecdd62bfb8a62b # v0.5.148
        with:
          command: release
          version: 0.4.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Builds the two release files, from the tag on a release and from the pull request otherwise.
  # The job runs the build scripts of every dependency, so its token can only read.
  build:
    needs: release
    # The release job is skipped on a pull request. Without !cancelled() a skipped need would
    # skip this job as well.
    if: >-
      !cancelled()
      && (github.event_name == 'pull_request'
        || (needs.release.result == 'success' && needs.release.outputs.releases_created == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Empty on a pull request, which checks out the pull request.
          ref: ${{ needs.release.outputs.tag }}
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: crates/app/view/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: crates/app/view/package.json
      - name: Install the libraries that Tauri links on Linux
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends libwebkit2gtk-4.1-dev libdbus-1-dev
      - run: pnpm --dir crates/app/view install --frozen-lockfile
      - run: pnpm --dir crates/app/view build
      - run: cargo build --release --locked -p zobrist-cli
      # Without a tag name and a token the action builds the AppImage and uploads nothing.
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        with:
          projectPath: crates/app
          tauriScript: ${{ github.workspace }}/crates/app/view/node_modules/.bin/tauri
      - name: Collect the two release files
        run: |
          mkdir release-files
          tar --create --gzip --file release-files/zobrist-x86_64-unknown-linux-gnu.tar.gz --directory target/release zobrist
          cp target/release/bundle/appimage/*.AppImage release-files/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: release-files/
          if-no-files-found: error

  # Attaches the two files to the draft that release-plz created and publishes it. A skipped
  # release job skips this job, so it never runs on a pull request.
  publish:
    needs: [release, build]
    if: needs.release.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: release-files
      - name: Attach the files and publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          gh release upload "$TAG" release-files/*
          gh release edit "$TAG" --draft=false
